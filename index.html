<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Midia Host - Gerenciador</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>📁 Gerenciador de Mídias</h1>
            <p>Gerencie imagens e vídeos do seu catálogo</p>
        </header>

        <!-- 📤 UPLOAD -->
        <section class="upload-section">
            <h2>📤 Upload de Arquivos</h2>
            <div class="upload-controls">
                <div class="upload-area" id="uploadArea">
                    <p>📂 Arraste arquivos aqui ou clique para selecionar</p>
                    <p style="font-size:12px;color:#64748b;">Formatos: PNG, JPG, MP4, MOV, etc.</p>
                    <input type="file" id="fileInput" style="display:none;" />
                    <button id="uploadBtn" class="btn-upload">📤 Selecionar Arquivos</button>
                </div>
                <div class="upload-pasta">
                    <label for="pastaUpload">Destino:</label>
                    <select id="pastaUpload">
                        <option value="images">📁 images</option>
                        <option value="videos">📁 videos</option>
                    </select>
                </div>
            </div>
            <div id="statusMsg" class="status-msg"></div>
        </section>

        <!-- 📋 LISTA -->
        <section class="media-section">
            <h2>📋 Suas Mídias</h2>
            <div id="mediaGrid" class="media-grid">
                <p class="empty-msg">⏳ Carregando mídias...</p>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
